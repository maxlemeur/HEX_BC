name: TesterArmy Full

# The audited target guard is retained. This job has no shared Supabase secrets:
# run-tester-army-ci creates and destroys its own native loopback stack, then
# runs real authenticated journeys only after migrations, pgTAP and RLS pass.
#
# Nightly full suite: its "full" phase runs every critical journey (the
# e2e.config.ts "full" selection includes e2e/army/critical/**) besides the
# extended and takeoff ones, so the critical suite also runs in full each night
# while pull requests run only the journeys their files reach
# (e2e-army-critical.yml, docs/testing/tester-army-ci.md).
#
# Parallel jobs (docs/testing/tester-army-ci.md, "Jobs parallèles"): the plan
# job lists the full selection from e2e.config.ts and the working tree and
# splits it into the disjoint shards of scripts/tester-army/army-shards.json,
# each on its own owned stack at one worker; the development phase runs alone
# on its own stack (full --phase development). The army-full job is the check:
# it fails unless every planned job succeeded and their verified evidence ran
# the whole listing and the development phase, then retains it all as
# army-full-evidence. A list that cannot be established is one shard running
# both phases on its stack, as before shards.
#
# A dispatch may filter the full selection by test title (input grep): one
# unsharded shard, recorded "filtered-full" with its pattern, proves only the
# selected journeys of the production full phase and skips the development
# phase. It never qualifies the full suite, and its run title, its check on
# the commit and its artifact say so. The schedule has no inputs: always
# unfiltered.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.grep != '' && 'TesterArmy Full (filtré --grep, non qualifiant)' || 'TesterArmy Full' }}
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optionnel : motif --grep des titres de tests (ex. ^VNEXT Team B.*US-4\\.1). Vide : suite full complète. Filtré : seuls les tests retenus de la phase full sont prouvés."
        required: false
        default: ""
        type: string
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

concurrency:
  group: army-full-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  army-full-plan:
    name: army-full plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      development: ${{ steps.plan.outputs.development }}
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Plain Node, no install. A filtered dispatch is one unsharded shard.
      - name: Plan the full suite shards
        id: plan
        env:
          # Through env and a quoted expansion, never pasted into the script.
          ARMY_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.grep || '' }}
        run: |
          set -euo pipefail
          args=(--plan full --report .e2e/army/ci/full-plan.json)
          if [[ -n "$ARMY_GREP" ]]; then args+=(--unsharded "dispatch --grep"); fi
          # Plain type stripping on a package without "type": silence the notice.
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tester-army/select-journeys.ts "${args[@]}"
      - name: Retain the shard plan
        if: always() && steps.plan.outputs.development != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-full-plan
          include-hidden-files: true
          path: .e2e/army/ci/full-plan.json
          if-no-files-found: error
          retention-days: 7

  # One owned stack per shard; a red shard never cancels the others.
  army-full-shard:
    name: army-full shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: army-full-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.army-full-plan.outputs.shards) }}
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install TesterArmy Chromium
        run: npx @e2e-dev/web install chromium --with-deps
      # Restore only: e2e-army-critical.yml saves this cache on a push to main.
      - name: Restore the Army Next build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e/army/next/cache
          key: army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - name: Announce a filtered full run
        if: github.event_name == 'workflow_dispatch' && inputs.grep != ''
        run: echo "::notice title=TesterArmy Full::Exécution filtrée par --grep (manifeste scope filtered-full et grep) ; seuls les tests retenus de la phase full sont prouvés, la phase développement n'est pas lancée ; ce run ne qualifie pas la suite full."
      - name: Run native database and TesterArmy full journeys
        id: journeys
        env:
          # Through env and a quoted expansion, never pasted into the script.
          # Empty (schedule, or a dispatch without a pattern): the plan's shard.
          ARMY_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.grep || '' }}
          # Empty for an unsharded plan: the runner's own selection.
          ARMY_FILES: ${{ matrix.files }}
          ARMY_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: node --import tsx scripts/run-tester-army-ci.ts full --shard "$ARMY_SHARD" ${ARMY_FILES:+--files "$ARMY_FILES"} ${ARMY_GREP:+--grep "$ARMY_GREP"}
      - name: Retain sanitized business evidence
        if: always() && steps.journeys.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-full-shard-${{ matrix.shard }}-evidence
          include-hidden-files: true
          path: ${{ steps.journeys.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7

  # The development phase alone (next dev, no production build) on its own
  # owned stack, beside the shards of the full phase.
  army-full-development:
    name: army-full development
    needs: army-full-plan
    if: needs.army-full-plan.outputs.development == 'separate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
