name: TesterArmy Full

# The audited target guard is retained. This job has no shared Supabase secrets:
# run-tester-army-ci creates and destroys its own native loopback stack, then
# runs real authenticated journeys only after migrations, pgTAP and RLS pass.
# On a pull request or a push to main, pgTAP and RLS run once, in rls-matrix,
# and the Army jobs delegate them (ARMY_DATABASE_CHECKS_DELEGATED_TO, the
# expression shared with the other Army workflows; this one starts on no pull
# request). The schedule and a dispatch run them on each stack.
#
# Nightly full suite: its "full" phase runs every critical journey (the
# "full" selection of scripts/tester-army/journey-selections.mjs includes
# e2e/army/critical/**) besides the extended and takeoff ones, so the critical
# suite also runs in full each night while pull requests run only the journeys
# their files reach
# (e2e-army-critical.yml, docs/testing/tester-army-ci.md).
#
# Parallel jobs (docs/testing/tester-army-ci.md, "Jobs parallèles"): the plan
# job lists the full selection from journey-selections.mjs and the working tree and
# splits it into the disjoint shards of scripts/tester-army/army-shards.json,
# each on its own owned stack at one worker; the development phase runs alone
# on its own stack (full --phase development). The army-full job is the check:
# it fails unless every planned job succeeded and their verified evidence ran
# the whole listing and the development phase, then retains it all as
# army-full-evidence. A list that cannot be established is one shard running
# both phases on its stack, as before shards.
#
# A dispatch may filter the full selection by test title (input grep): one
# unsharded shard, recorded "filtered-full" with its pattern, proves only the
# selected journeys of the production full phase and skips the development
# phase. It never qualifies the full suite, and its run title, its check on
# the commit and its artifact say so. The schedule and a push have no inputs:
# always unfiltered.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.grep != '' && 'TesterArmy Full (filtré --grep, non qualifiant)' || 'TesterArmy Full' }}
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optionnel : motif --grep des titres de tests (ex. ^VNEXT Team B.*US-4\\.1). Vide : suite full complète. Filtré : seuls les tests retenus de la phase full sont prouvés."
        required: false
        default: ""
        type: string
  # Every push to main that is not documentation only: main is otherwise
  # checked by the critical suite alone (docs/testing/tester-army-ci.md,
  # "Campagnes de main après un push"). All pushes share one concurrency group
  # that cancels nothing: one campaign runs, the newest waits and replaces an
  # older waiting one, whose commits it contains. A documentation push starts
  # none, so it never replaces a waiting campaign.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

concurrency:
  group: army-full-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  army-full-plan:
    name: army-full plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      development: ${{ steps.plan.outputs.development }}
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Plain Node, no install. A filtered dispatch is one unsharded shard.
      - name: Plan the full suite shards
        id: plan
        env:
          # Through env and a quoted expansion, never pasted into the script.
          ARMY_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.grep || '' }}
        run: |
          set -euo pipefail
          args=(--plan full --report .e2e/army/ci/full-plan.json)
          if [[ -n "$ARMY_GREP" ]]; then args+=(--unsharded "dispatch --grep"); fi
          # Plain type stripping on a package without "type": silence the notice.
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tester-army/select-journeys.ts "${args[@]}"
      - name: Retain the shard plan
        if: always() && steps.plan.outputs.development != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-full-plan
          include-hidden-files: true
          path: .e2e/army/ci/full-plan.json
          if-no-files-found: error
          retention-days: 7
          # A rerun replaces the artifact of the attempt before it: the name stays unique.
          overwrite: true

  # One owned stack per shard; a red shard never cancels the others.
  # The production build of this run, made once in parallel with the plan
  # (docs/testing/tester-army-ci.md, "Pile, confidentialité et diagnostic"):
  # each shard downloads it and serves it only when the runner proves it is the
  # build of its checkout for its stack; the development job runs next dev and
  # builds nothing. When this job fails, the shards build as before; it never
  # fails a shard. Restore only: e2e-army-critical.yml saves the Next build
  # cache on a push to main.
  army-full-build:
    name: army-full-build
    runs-on: ubuntu-24.04
    # The checkout, an install, a bare native stack and one production build, with room to spare.
    timeout-minutes: 25
    # A failed build only makes the shards build their application (the step below
    # says so): it never turns the run red, which ci-night-alert reads on main.
    continue-on-error: true
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    outputs:
      built: ${{ steps.published.outputs.built }}
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Next's webpack cache of the Army build (.build/tester-army/next/cache, outside
      # the build fingerprint of build-local.mjs): the latest one main saved.
      - name: Restore the Army Next build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tester-army/next/cache
          key: army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - name: Build the production application once for this run
        id: build
        # Well under the job's limit: a hung build fails here and the warning below still runs.
        timeout-minutes: 15
        run: node --import tsx scripts/tester-army/army-build.ts --out "$RUNNER_TEMP/army-prebuilt"
      # One day: the jobs of this run, and a rerun of its failed jobs, read it.
      - name: Publish the production build to this run's jobs
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-prebuilt-build
          include-hidden-files: true
          path: ${{ runner.temp }}/army-prebuilt
          if-no-files-found: error
          retention-days: 1
          # A rerun replaces the artifact of the attempt before it: the name stays unique.
          overwrite: true
      - name: Offer the build to this run's jobs
        id: published
        if: steps.build.outcome == 'success'
        run: echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Warn that the shards build the application themselves
        if: failure()
        run: echo "::warning title=Army build failed::No production build was published for this run; each shard builds its application itself (slower, not red)."

  army-full-shard:
    name: army-full shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: [army-full-plan, army-full-build]
    # A failed army-full-build only makes the shard build its application.
    if: ${{ !cancelled() && needs.army-full-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # The account runs 20 jobs at once: a push campaign takes two of them,
      # besides its development job.
      max-parallel: ${{ github.event_name == 'push' && 2 || 20 }}
      matrix:
        include: ${{ fromJSON(needs.army-full-plan.outputs.shards) }}
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install TesterArmy Chromium
        run: npx @e2e-dev/web install chromium
      # The production build of this run, from army-build: the runner serves it only
      # when it is the build of this checkout for this job's stack (origin, anon
      # key, sources, runtime and output digests; scripts/tester-army/prebuilt-build.ts)
      # and builds as before otherwise, saying why. A missing artifact is no error.
      - name: Download the production build of this run
        id: prebuilt
        if: needs.army-full-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: army-prebuilt-build
          path: ${{ runner.temp }}/army-prebuilt
      # Restore only, even beside a downloaded build (a refused one builds warm):
      # e2e-army-critical.yml saves this cache on a push to main.
      - name: Restore the Army Next build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tester-army/next/cache
          key: army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - name: Announce a filtered full run
        if: github.event_name == 'workflow_dispatch' && inputs.grep != ''
        run: echo "::notice title=TesterArmy Full::Exécution filtrée par --grep (manifeste scope filtered-full et grep) ; seuls les tests retenus de la phase full sont prouvés, la phase développement n'est pas lancée ; ce run ne qualifie pas la suite full."
      - name: Run native database and TesterArmy full journeys
        id: journeys
        env:
          # pgTAP and the RLS matrix of a pull request or of a push to main run once, in rls-matrix
          # (scripts/tester-army/database-checks.ts); a scheduled or dispatched campaign keeps its own.
          # The expression is shared with the other Army workflows: this one starts on no pull request.
          ARMY_DATABASE_CHECKS_DELEGATED_TO: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main') && 'rls-matrix' || '' }}
          # Through env and a quoted expansion, never pasted into the script.
          # Empty (schedule, or a dispatch without a pattern): the plan's shard.
          ARMY_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.grep || '' }}
          # Empty for an unsharded plan: the runner's own selection.
          ARMY_FILES: ${{ matrix.files }}
          ARMY_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          ARMY_PREBUILT_BUILD_DIR: ${{ runner.temp }}/army-prebuilt
        run: node --import tsx scripts/run-tester-army-ci.ts full --shard "$ARMY_SHARD" ${ARMY_FILES:+--files "$ARMY_FILES"} ${ARMY_GREP:+--grep "$ARMY_GREP"}
      - name: Retain sanitized business evidence
        if: always() && steps.journeys.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-full-shard-${{ matrix.shard }}-evidence
          include-hidden-files: true
          path: ${{ steps.journeys.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
          # A rerun replaces the artifact of the attempt before it: the name stays unique.
          overwrite: true

  # The development phase alone (next dev, no production build) on its own
  # owned stack, beside the shards of the full phase.
  army-full-development:
    name: army-full development
    needs: army-full-plan
    if: needs.army-full-plan.outputs.development == 'separate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install TesterArmy Chromium
        run: npx @e2e-dev/web install chromium
      - name: Run native database and TesterArmy development journeys
        id: journeys
        env:
          # As in the shards: delegated to rls-matrix on a pull request or a push to main.
          ARMY_DATABASE_CHECKS_DELEGATED_TO: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main') && 'rls-matrix' || '' }}
        run: node --import tsx scripts/run-tester-army-ci.ts full --phase development
      - name: Retain sanitized business evidence
        if: always() && steps.journeys.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-full-development-evidence
          include-hidden-files: true
          path: ${{ steps.journeys.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
          # A rerun replaces the artifact of the attempt before it: the name stays unique.
          overwrite: true

  # The check of the full suite: green only when the plan, every shard and the
  # development job succeeded and their verified evidence ran the whole plan
  # (scripts/tester-army/aggregate-shards.ts). A filtered dispatch keeps its
  # non-qualifying names.
  army-full:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.grep != '' && 'army-full (filtré --grep, non qualifiant)' || 'army-full' }}
    needs: [army-full-plan, army-full-shard, army-full-development]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download the shard plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: army-full-plan
          path: .e2e/army/ci/aggregate-input/plan
      - name: Download the shard and development evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: army-full-*-evidence
          path: .e2e/army/ci/aggregate-input/units
      - name: Aggregate the full suite jobs
        id: aggregate
        env:
          PLAN_RESULT: ${{ needs.army-full-plan.result }}
          SHARDS_RESULT: ${{ needs.army-full-shard.result }}
          DEVELOPMENT_RESULT: ${{ needs.army-full-development.result }}
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tester-army/aggregate-shards.ts full
          --plan .e2e/army/ci/aggregate-input/plan/full-plan.json
          --evidence .e2e/army/ci/aggregate-input/units --out .e2e/army/ci/aggregate
          --results "army-full-plan=$PLAN_RESULT,army-full-shard=$SHARDS_RESULT,army-full-development=$DEVELOPMENT_RESULT"
          --revision "$GITHUB_SHA"
      - name: Retain sanitized business evidence
        if: always() && steps.aggregate.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.grep != '' && 'army-full-filtered-evidence' || 'army-full-evidence' }}
          include-hidden-files: true
          path: ${{ steps.aggregate.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
          # A rerun replaces the artifact of the attempt before it: the name stays unique.
          overwrite: true
