            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Download the shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: army-full-plan
          path: .e2e/army/ci/aggregate-input/plan
      - name: Download the shard and development evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: army-full-*-evidence
          path: .e2e/army/ci/aggregate-input/units
      - name: Aggregate the full suite jobs
        id: aggregate
        env:
          PLAN_RESULT: ${{ needs.army-full-plan.result }}
          SHARDS_RESULT: ${{ needs.army-full-shard.result }}
          DEVELOPMENT_RESULT: ${{ needs.army-full-development.result }}
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tester-army/aggregate-shards.ts full
          --plan .e2e/army/ci/aggregate-input/plan/full-plan.json
          --evidence .e2e/army/ci/aggregate-input/units --out .e2e/army/ci/aggregate
          --results "army-full-plan=$PLAN_RESULT,army-full-shard=$SHARDS_RESULT,army-full-development=$DEVELOPMENT_RESULT"
          --revision "$GITHUB_SHA"
      - name: Retain sanitized business evidence
        if: always() && steps.aggregate.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.grep != '' && 'army-full-filtered-evidence' || 'army-full-evidence' }}
          include-hidden-files: true
          path: ${{ steps.aggregate.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
