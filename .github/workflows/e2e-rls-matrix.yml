name: E2E RLS Matrix

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: e2e-rls-matrix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      MIGRATION_DIFF_MODE: ${{ github.event_name }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enforce append-only migration history
        run: npm run supabase:migrations:git-guard

      - name: Validate and test the local database
        run: npm run db:ci:local
