name: E2E RLS Matrix

# Cette matrice monte une pile Supabase Docker complete : ~3 min de machine.
# Elle ne se declenche donc que quand la base peut reellement avoir bouge
# (migrations, tests pgTAP, outillage de garde), plus une passe nocturne qui
# couvre les derives indirectes.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "src/lib/estimates/rls.e2e.test.ts"
      - "src/test/supabase-migration*"
      - "src/test/local-supabase-ci*"
      - "scripts/*supabase*"
      - ".github/workflows/e2e-rls-matrix.yml"
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-rls-matrix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      MIGRATION_DIFF_MODE: ${{ github.event_name }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enforce append-only migration history
        run: npm run supabase:migrations:git-guard

      - name: Validate and test the local database
        run: npm run db:ci:local
