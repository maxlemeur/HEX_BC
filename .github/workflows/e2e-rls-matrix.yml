name: E2E RLS Matrix

# Cette matrice monte une pile Supabase locale en runtime natif, sans Docker :
# chaque service tourne comme un processus du runner ubuntu-24.04 (glibc 2.39).
# Le job existe sur chaque PR pour pouvoir etre exige par le ruleset de main.
# Seules les etapes lourdes sont conditionnelles ; une passe manuelle reste
# complete pour qualifier les derives indirectes quand cela est necessaire.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: e2e-rls-matrix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      # Le garde n'accepte que local | pull_request | push : on mappe
      # explicitement, sinon la passe manuelle le ferait echouer.
      MIGRATION_DIFF_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'local' }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether database validation is required
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A separate command preserves git failures. NUL delimiters handle
            # spaces, and --no-renames catches migrations moved out of scope.
            git diff --name-only --no-renames -z "$PR_BASE_SHA...$PR_HEAD_SHA" > "$RUNNER_TEMP/rls-changed-paths"
            required=false
            while IFS= read -r -d '' changed_path; do
              case "$changed_path" in
                supabase/*|src/lib/estimates/rls.e2e.test.ts|src/test/supabase*|src/test/local-supabase-ci*|scripts/*supabase*|.github/workflows/e2e-rls-matrix.yml|package.json|package-lock.json|.npmrc|.nvmrc|vitest*.ts|tsconfig*.json)
                  required=true
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/rls-changed-paths"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Database validation required: running the native Supabase matrix."
          else
            echo "No database/runtime changes in this PR: native Supabase tests not required."
          fi

      - name: Setup Node.js
        if: ${{ steps.scope.outputs.required == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        if: ${{ steps.scope.outputs.required == 'true' }}
        run: npm ci

      - name: Enforce append-only migration history
        if: ${{ steps.scope.outputs.required == 'true' }}
        run: npm run supabase:migrations:git-guard

      - name: Validate and test the local database
        if: ${{ steps.scope.outputs.required == 'true' }}
        run: npm run db:ci:local
