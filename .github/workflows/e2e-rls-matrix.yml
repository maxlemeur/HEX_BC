name: E2E RLS Matrix

# Cette matrice monte une pile Supabase locale en runtime natif, sans Docker :
# chaque service tourne comme un processus du runner ubuntu-24.04 (glibc 2.39).
# Le job tourne en entier sur chaque PR, exige par le ruleset de main, et
# sur chaque push de main qui ne touche pas que la documentation : il y porte
# seul pgTAP et la matrice RLS, plafonds de requetes compris. Les jobs Army
# de la meme PR ou du meme push les lui deleguent au lieu de les rejouer dans
# chacune de leurs piles (scripts/tester-army/database-checks.ts). Aucune
# condition ne saute ses etapes : une PR de documentation peut aussi lancer
# des jobs Army (label army-full, diff vide), qui delegueraient alors a un
# check qui n'aurait rien execute. Un run rouge de main (push ou planifie)
# ouvre le ticket « CI rouge sur main » (ci-night-alert.yml).
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  # Chaque push de main pour lequel les workflows Army tournent (meme
  # paths-ignore) : leurs jobs lui deleguent pgTAP et la matrice RLS. Un run
  # de push n'est jamais annule par un plus recent (groupe par run). Le garde
  # d'historique des migrations de ce push est celui du Quality Gate (mode
  # push) ; ici il reste en mode local.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # Avec les pushs ci-dessus, le seul job qui mesure les plafonds de requetes
    # CI sur main : les suites Army construisent en parallele de leurs
    # controles de base et les sautent.
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-rls-matrix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      # Le garde n'accepte que local | pull_request | push : on mappe
      # explicitement, sinon la passe manuelle le ferait echouer.
      MIGRATION_DIFF_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'local' }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enforce append-only migration history
        run: npm run supabase:migrations:git-guard

      - name: Validate and test the local database
        run: npm run db:ci:local
