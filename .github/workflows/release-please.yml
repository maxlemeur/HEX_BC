name: Release Please

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A dedicated token lets release PRs trigger the existing quality gate.
          # The built-in token remains a functional fallback.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
