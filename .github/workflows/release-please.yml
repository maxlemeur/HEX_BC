name: Release Please

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release
        uses: googleapis/release-please-action@v4
        with:
          # A dedicated token lets release PRs trigger the existing quality gate.
          # The built-in token remains a functional fallback.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
