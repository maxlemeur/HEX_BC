name: Quality Gate

# Garde-fou sans secret : dependances, architecture, OpenAPI, qualite statique,
# tests bornes, couverture des frontieres critiques et artefact Webpack reel.
# Le smoke lance l'artefact avec `next start`; Playwright garde la validation
# fonctionnelle distante dans un workflow separe et serialise.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "1"
      # Valeurs factices : les modules importes a la compilation instancient un
      # client Supabase, mais aucun test unitaire n'atteint le reseau.
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Verify dependency signatures
        if: ${{ !cancelled() }}
        run: npm run audit:signatures

      - name: Enforce architecture budgets
        if: ${{ !cancelled() }}
        run: npm run check:architecture

      # Les etapes tournent meme si une precedente echoue : une PR voit
      # ainsi tous ses problemes en une passe au lieu d'un par aller-retour.
      - name: Validate OpenAPI
        id: openapi
        run: npm run validate-openapi

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Les deux projets Vitest ont des environnements incompatibles. Les
      # isoler empeche un test React/jsdom d'etre execute sous Node et rend le
      # diagnostic CI explicite pour chaque perimetre.
      - name: Unit tests (Node)
        id: tests-node
        if: ${{ !cancelled() }}
        run: npm run test:ci:node

      - name: Unit tests (jsdom)
        id: tests-jsdom
        if: ${{ !cancelled() }}
        run: npm run test:ci:jsdom

      - name: Critical boundary coverage
        id: critical-coverage
        if: ${{ !cancelled() }}
        run: npm run test:critical-coverage

      - name: Production Webpack build and smoke
        id: production-smoke
        if: ${{ !cancelled() }}
        run: npm run verify:production
