name: Quality Gate

# Garde-fou sans secret, decoupe en jobs paralleles : le retour arrive en ~3 min
# et le nom du job en echec dit deja ou chercher.
#
# Sur une PR, seuls « Statique » et « Tests » tournent : c'est le retour utile,
# pour deux runners. Le build de production ne tourne que sur main (la branche
# qui deploie) et en nocturne : il ne protege rien de plus sur une PR, puisque
# rien ne part en production depuis une branche.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  # Valeurs factices : les modules importes a la compilation instancient un
  # client Supabase, mais aucun test unitaire n'atteint le reseau.
  NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"

jobs:
  static:
    name: Statique
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
      # Le garde n'accepte que local | pull_request | push : on mappe
      # explicitement, sinon un declenchement planifie le ferait echouer.
      MIGRATION_DIFF_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || (github.event_name == 'push' && 'push') || 'local' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Les etapes tournent meme si une precedente echoue : une PR voit ainsi
      # tous ses problemes en une passe au lieu d'un par aller-retour.
      - name: Enforce append-only migration history
        run: npm run supabase:migrations:git-guard

      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm run audit:dependencies

      - name: Verify dependency signatures
        if: ${{ !cancelled() }}
        run: npm run audit:signatures

      - name: Enforce architecture budgets
        if: ${{ !cancelled() }}
        run: npm run check:architecture

      - name: Validate OpenAPI
        if: ${{ !cancelled() }}
        run: npm run validate-openapi

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Les deux projets Vitest ont des environnements incompatibles. Les
      # isoler empeche un test React/jsdom d'etre execute sous Node et rend le
      # diagnostic CI explicite pour chaque perimetre.
      - name: Unit tests (Node)
        run: npm run test:ci:node

      - name: Unit tests (jsdom)
        if: ${{ !cancelled() }}
        run: npm run test:ci:jsdom

      - name: Critical boundary coverage
        if: ${{ !cancelled() }}
        run: npm run test:critical-coverage

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production Webpack build and smoke
        run: npm run verify:production

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [static, tests, build]
    if: ${{ always() }}
    steps:
      - name: Aggregate results
        run: |
          set -euo pipefail
          echo "statique : ${{ needs.static.result }}"
          echo "tests    : ${{ needs.tests.result }}"
          echo "build    : ${{ needs.build.result }}"
          for result in "${{ needs.static.result }}" "${{ needs.tests.result }}" "${{ needs.build.result }}"; do
            # « skipped » est attendu : le build ne tourne pas sur une PR.
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Quality Gate en echec : voir le job ci-dessus qui n'est pas 'success'."
              exit 1
            fi
          done
          echo "Quality Gate au vert."
