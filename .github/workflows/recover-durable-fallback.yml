# Planificateur unique de la reprise durable : GET /api/internal/workflows/recover.
# Le cron a ete retire de vercel.json car le plan Vercel de l'equipe est Hobby,
# qui n'autorise qu'une execution quotidienne : Vercel refusait alors de creer
# le moindre deploiement (production figee du 09/08 au 19/08/2026).
# Production origin: secrets.HEX_APP_URL, else vars.APP_URL. Fail closed if both
# are missing. Do not log CRON_SECRET.

name: Recover Durable Fallback

on:
  schedule:
    - cron: "*/5 * * * *"

# One recovery run at a time so overlapping GitHub runs do not contend on leases.
concurrency:
  group: recover-durable-fallback
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # HTTP 200 alone is insufficient. Emit counters only, never the response body.
      # Individual failures warn; unavailable drains and exhausted retries fail.
      # Contract: supabase/README.md, section "Reprise des tâches et emails".
      - name: Recover and check durable workflows
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEX_APP_URL: ${{ secrets.HEX_APP_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/check-durable-recovery.mjs
