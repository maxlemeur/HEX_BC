# Hobby-plan fallback for vercel.json cron GET /api/internal/workflows/recover.
# Production origin: secrets.HEX_APP_URL, else vars.APP_URL. Fail closed if both
# are missing. Do not log CRON_SECRET.

name: Recover Durable Fallback

on:
  schedule:
    - cron: "*/5 * * * *"

# One recovery run at a time: the Vercel cron may fire on the same path, and an
# overlapping GitHub run would only contend on the same leases.
concurrency:
  group: recover-durable-fallback
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEX_APP_URL: ${{ secrets.HEX_APP_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing secret: CRON_SECRET"
            exit 1
          fi
          app_url="${HEX_APP_URL:-${APP_URL:-}}"
          app_url="${app_url%/}"
          if [ -z "${app_url}" ]; then
            echo "Missing secret HEX_APP_URL (or variable APP_URL)"
            exit 1
          fi
          case "${app_url}" in
            https://*) ;;
            *)
              echo "HEX_APP_URL/APP_URL must be an https origin"
              exit 1
              ;;
          esac

      - name: Recover durable workflows
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEX_APP_URL: ${{ secrets.HEX_APP_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          app_url="${HEX_APP_URL:-${APP_URL:-}}"
          app_url="${app_url%/}"
          curl -fsS -X GET \
            --connect-timeout 15 \
            --max-time 280 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${app_url}/api/internal/workflows/recover"
