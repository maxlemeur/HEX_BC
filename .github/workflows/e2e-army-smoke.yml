name: TesterArmy anonymous smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: army-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Anonymous UI only: no shared database, credentials or model provider.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: army-anonymous-smoke-no-auth
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Browsers for the playwright-core version @e2e-dev/web pins, not the root playwright package.
      - run: npx @e2e-dev/web install chromium --with-deps
      - run: npm run e2e
      - name: Retain anonymous evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-anonymous-evidence
          include-hidden-files: true
          path: |
            .e2e/army/manifest.json
            .e2e/army/report.json
            .e2e/army/results/
            .e2e/army/runs/
          retention-days: 14
