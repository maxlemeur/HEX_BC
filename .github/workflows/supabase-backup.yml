name: Supabase Backup

on:
  schedule:
    - cron: "25 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RETENTION_DAYS: "30"
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Verify locked Supabase CLI
        run: test "$(npx --no-install supabase --version)" = "2.109.1"

      - name: Validate required secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing secret: SUPABASE_DB_URL"
            echo "Use a percent-encoded Postgres connection string."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Dump database
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          outdir="backups/${timestamp}"
          archive="supabase-backup-${timestamp}.tar.gz"

          mkdir -p "$outdir"

          npx --no-install supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --schema public,auth,storage \
            --file "$outdir/schema.sql"

          npx --no-install supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --role-only \
            --file "$outdir/roles.sql"

          npx --no-install supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --data-only \
            --use-copy \
            --schema public,auth,storage \
            --file "$outdir/data.sql"

          tar -C backups -czf "$archive" "$timestamp"
          rm -rf "$outdir"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.dump.outputs.archive }}
          path: ${{ steps.dump.outputs.archive }}
          retention-days: ${{ fromJSON(env.RETENTION_DAYS) }}

      - name: Notify backup failure
        if: failure()
        env:
          BACKUP_ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
        run: |
          set -euo pipefail
          echo "::error::Supabase backup failed"
          echo "Supabase backup failed" >> "${GITHUB_STEP_SUMMARY}"
          if [ -n "${BACKUP_ALERT_WEBHOOK:-}" ]; then
            curl -fsS -X POST \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Content-Type: application/json" \
              --data '{"text":"Supabase backup failed"}' \
              "${BACKUP_ALERT_WEBHOOK}" \
              || echo "::warning::Backup alert webhook failed"
          fi
