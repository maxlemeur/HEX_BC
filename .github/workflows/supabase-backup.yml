name: Supabase Backup

on:
  schedule:
    - cron: "25 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RETENTION_DAYS: "30"
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Verify locked Supabase CLI
        run: test "$(npx --no-install supabase --version)" = "2.121.0"

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing secret: SUPABASE_DB_URL"
            echo "Use a percent-encoded Postgres connection string."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Validate backup encryption certificate
        run: |
          set -euo pipefail
          cert_path="$GITHUB_WORKSPACE/.github/backup-recipient.pem"
          if [ ! -f "$cert_path" ] || grep -Eq -- '-----BEGIN .*PRIVATE KEY-----' "$cert_path"; then
            echo "::error::The tracked backup recipient must be a public certificate"
            exit 1
          fi
          if ! openssl x509 -in "$cert_path" -noout -checkend 86400; then
            echo "::error::The backup recipient certificate is invalid or expires within 24 hours"
            exit 1
          fi

      - name: Dump and encrypt database
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          plain_root="$RUNNER_TEMP/backup-plain"
          outdir="$plain_root/$timestamp"
          encrypted_dir="$RUNNER_TEMP/backup-encrypted"
          archive="supabase-backup-${timestamp}.tar.gz.cms"

          mkdir -p "$outdir" "$encrypted_dir"

          npx --no-install supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --schema public,auth,storage \
            --file "$outdir/schema.sql"

          npx --no-install supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --role-only \
            --file "$outdir/roles.sql"

          npx --no-install supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --data-only \
            --use-copy \
            --schema public,auth,storage \
            --file "$outdir/data.sql"

          tar -C "$plain_root" -czf - "$timestamp" \
            | openssl cms -encrypt -aes-256-cbc -binary -stream -outform DER \
                -recip "$GITHUB_WORKSPACE/.github/backup-recipient.pem" \
                -out "$encrypted_dir/$archive"
          openssl cms -cmsout -inform DER -in "$encrypted_dir/$archive" \
            -out /dev/null

          echo "archive_name=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_path=$encrypted_dir/$archive" >> "$GITHUB_OUTPUT"

      - name: Remove plaintext dump
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/backup-plain"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dump.outputs.archive_name }}
          path: ${{ steps.dump.outputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.RETENTION_DAYS) }}

      - name: Notify backup failure
        if: failure()
        env:
          BACKUP_ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
        run: |
          set -euo pipefail
          echo "::error::Supabase backup failed"
          echo "Supabase backup failed" >> "${GITHUB_STEP_SUMMARY}"
          if [ -n "${BACKUP_ALERT_WEBHOOK:-}" ]; then
            curl -fsS -X POST \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Content-Type: application/json" \
              --data '{"text":"Supabase backup failed"}' \
              "${BACKUP_ALERT_WEBHOOK}" \
              || echo "::warning::Backup alert webhook failed"
          fi
