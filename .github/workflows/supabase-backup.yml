name: Supabase Backup

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RETENTION_DAYS: "30"
      POSTGRES_IMAGE: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned PostgreSQL client
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_IMAGE"
          docker run --rm "$POSTGRES_IMAGE" pg_dump --version

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing secret: SUPABASE_DB_URL"
            echo "Use a percent-encoded Postgres connection string."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Validate backup encryption certificate
        run: |
          set -euo pipefail
          cert_path="$GITHUB_WORKSPACE/.github/backup-recipient.pem"
          if [ ! -f "$cert_path" ] || grep -Eq -- '-----BEGIN .*PRIVATE KEY-----' "$cert_path"; then
            echo "::error::The tracked backup recipient must be a public certificate"
            exit 1
          fi
          if ! openssl x509 -in "$cert_path" -noout -checkend 86400; then
            echo "::error::The backup recipient certificate is invalid or expires within 24 hours"
            exit 1
          fi
          openssl x509 -in "$GITHUB_WORKSPACE/.github/supabase-ca.crt" -noout -checkend 86400

      - name: Dump and encrypt database
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          plain_root="$RUNNER_TEMP/backup-plain"
          outdir="$plain_root/$timestamp"
          encrypted_dir="$RUNNER_TEMP/backup-encrypted"
          archive="supabase-backup-${timestamp}.tar.gz.cms"

          mkdir -p "$outdir" "$encrypted_dir"

          python3 - "$outdir" <<'PY'
          import os
          import subprocess
          import sys
          from urllib.parse import unquote, urlsplit

          connection = urlsplit(os.environ["SUPABASE_DB_URL"])
          if connection.scheme not in ("postgres", "postgresql") or not all(
              (connection.hostname, connection.username, connection.password, connection.path.lstrip("/"))
          ):
              raise SystemExit("SUPABASE_DB_URL must contain a Postgres host, username, password and database")
          environment = os.environ.copy()
          environment.update(
              PGHOST=connection.hostname,
              PGPORT=str(connection.port or 5432),
              PGUSER=unquote(connection.username),
              PGPASSWORD=unquote(connection.password),
              PGDATABASE=unquote(connection.path.lstrip("/")),
              PGSSLMODE="verify-full",
              PGSSLROOTCERT="/supabase-ca.crt",
              PGCONNECT_TIMEOUT="20",
          )
          client = [
              "docker", "run", "--rm", "--network=host",
              "--user", f"{os.getuid()}:{os.getgid()}",
          ]
          for name in ("PGHOST", "PGPORT", "PGUSER", "PGPASSWORD", "PGDATABASE", "PGSSLMODE", "PGSSLROOTCERT", "PGCONNECT_TIMEOUT"):
              client.extend(("--env", name))
          client.extend((
              "--volume", f"{sys.argv[1]}:/backup",
              "--volume", f"{os.environ['GITHUB_WORKSPACE']}/.github/supabase-ca.crt:/supabase-ca.crt:ro",
              os.environ["POSTGRES_IMAGE"],
          ))
          # One snapshot contains both schema and data, including rows hidden by RLS.
          subprocess.run(client + [
              "pg_dump", "--format=custom", "--strict-names", "--lock-wait-timeout=30s",
              "--schema=public", "--schema=private", "--schema=auth", "--schema=storage",
              "--file=/backup/database.dump",
          ], env=environment, check=True)
          # Inventory only: platform roles must not be restored blindly on Supabase.
          subprocess.run(client + [
              "pg_dumpall", "--roles-only", "--no-role-passwords", "--database=postgres",
              "--file=/backup/roles.sql",
          ], env=environment, check=True)
          PY

          tar -C "$plain_root" -czf - "$timestamp" \
            | openssl cms -encrypt -aes-256-cbc -binary -stream -outform DER \
                -recip "$GITHUB_WORKSPACE/.github/backup-recipient.pem" \
                -out "$encrypted_dir/$archive"
          openssl cms -cmsout -inform DER -in "$encrypted_dir/$archive" \
            -out /dev/null

          echo "archive_name=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_path=$encrypted_dir/$archive" >> "$GITHUB_OUTPUT"

      - name: Remove plaintext dump
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/backup-plain"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dump.outputs.archive_name }}
          path: ${{ steps.dump.outputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.RETENTION_DAYS) }}

      - name: Notify backup failure
        if: failure()
        env:
          BACKUP_ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
        run: |
          set -euo pipefail
          echo "::error::Supabase backup failed"
          echo "Supabase backup failed" >> "${GITHUB_STEP_SUMMARY}"
          if [ -n "${BACKUP_ALERT_WEBHOOK:-}" ]; then
            curl -fsS -X POST \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Content-Type: application/json" \
              --data '{"text":"Supabase backup failed"}' \
              "${BACKUP_ALERT_WEBHOOK}" \
              || echo "::warning::Backup alert webhook failed"
          fi
