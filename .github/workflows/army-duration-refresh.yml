name: Refresh TesterArmy durations

on:
  schedule:
    - cron: '35 8 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency: army-duration-refresh

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Measure the latest green main campaigns with retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sources=()
          for suite in critical full; do
            runs=$(gh run list --workflow "e2e-army-$suite.yml" --branch main --status success --limit 100 \
              --json event,databaseId,headSha --jq '.[] | select(.event=="push" or .event=="schedule") | [.databaseId,.headSha] | @tsv')
            while read -r id sha; do
              [[ -n "$id" ]] || continue
              artifact="army-$suite-evidence"
              available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=$artifact" \
                --jq '[.artifacts[] | select(.expired == false)] | length')
              [[ "$available" != 0 ]] || continue
              dir="$RUNNER_TEMP/army-refresh/$suite"
              gh run download "$id" --name "$artifact" --dir "$dir"
              sources+=("$suite" "$id" "$sha" "$dir")
              break
            done <<< "$runs"
          done
          node scripts/tester-army/refresh-durations.ts "${sources[@]}"
      - name: Retain the proposed configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-duration-proposal
          path: scripts/tester-army/army-shards.json
          retention-days: 7
      - name: Open or update the duration pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/army-duration-refresh
          add-paths: scripts/tester-army/army-shards.json
          commit-message: "chore(ci): refresh measured Army journey durations"
          title: "chore(ci): refresh measured Army journey durations"
          body: |
            Relevé hebdomadaire des campagnes vertes de main. Les entrées measured citent les runs sources de chaque durée modifiée.
            [Écarts mesurés et proposition](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
