name: Refresh TesterArmy durations

on:
  schedule:
    - cron: '35 8 * * 1'
  workflow_dispatch:

permissions: {}

concurrency: army-duration-refresh

jobs:
  measure:
    if: github.repository == 'thannous/HEX_BC' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.measure.outputs.changed }}
      revision: ${{ steps.measure.outputs.revision }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Measure the latest green main campaigns with retained evidence
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sources=()
          for suite in critical full; do
            runs=$(gh run list --workflow "e2e-army-$suite.yml" --branch main --status success --limit 100 \
              --json event,databaseId,headSha --jq '.[] | select(.event=="push" or .event=="schedule") | [.databaseId,.headSha] | @tsv')
            while read -r id sha; do
              [[ -n "$id" ]] || continue
              artifact="army-$suite-evidence"
              available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=$artifact" \
                --jq '[.artifacts[] | select(.expired == false)] | length')
              [[ "$available" != 0 ]] || continue
              dir="$RUNNER_TEMP/army-refresh/$suite"
              gh run download "$id" --name "$artifact" --dir "$dir"
              sources+=("$suite" "$id" "$sha" "$dir")
              break
            done <<< "$runs"
          done
          node scripts/tester-army/refresh-durations.ts "${sources[@]}"
          if ! git diff --quiet -- scripts/tester-army/army-shards.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain the proposed configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: army-duration-proposal
          path: scripts/tester-army/army-shards.json
          retention-days: 7
          overwrite: true

  publish:
    needs: measure
    if: needs.measure.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      HAS_REFRESH_APP: ${{ vars.ARMY_REFRESH_APP_CLIENT_ID != '' && secrets.ARMY_REFRESH_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: army-duration-proposal
          path: ${{ runner.temp }}/army-duration-proposal
      - name: Validate the proposal against main
        env:
          MEASURED_REVISION: ${{ needs.measure.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$MEASURED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if ! git diff --quiet "$MEASURED_REVISION" HEAD -- e2e/army scripts/tester-army/army-shards.json; then
            echo "Journey inputs changed after measurement; dispatch a fresh run on main."
            exit 1
          fi
          node scripts/tester-army/refresh-durations.ts --apply-proposal "$RUNNER_TEMP/army-duration-proposal/army-shards.json"
      - name: Mint the optional repository-scoped PR token
        id: app
        if: env.HAS_REFRESH_APP == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.ARMY_REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARMY_REFRESH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Explain how proposal checks start
        id: checks
        run: |
          if [[ "$HAS_REFRESH_APP" == true ]]; then
            guidance="La GitHub App déclenche les checks à l’ouverture ou à la mise à jour de la PR."
          else
            guidance="Avec GITHUB_TOKEN, les checks attendent un mainteneur. Sur la PR, choisir **Approve workflows to run**. Si aucun run n’apparaît, fermer puis rouvrir la PR avec un compte ayant les droits d’écriture."
          fi
          echo "guidance=$guidance" >> "$GITHUB_OUTPUT"
          echo "$guidance" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the duration pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          base: main
          branch: automation/army-duration-refresh
          add-paths: scripts/tester-army/army-shards.json
          commit-message: "chore(ci): refresh measured Army journey durations"
          title: "chore(ci): refresh measured Army journey durations"
          body: |
            Relevé hebdomadaire des campagnes vertes de main. Les entrées measured citent les runs sources de chaque durée modifiée.
            [Écarts mesurés et proposition](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            ${{ steps.checks.outputs.guidance }}
