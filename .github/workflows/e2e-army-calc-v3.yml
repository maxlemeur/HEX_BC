name: TesterArmy calc-v3

# Lot 2 calc-v3 campaign (docs/testing/tester-army-calc-v3.md), as
# e2e-army-full.yml: the audited target guard is retained and no shared
# Supabase secret is loaded; run-tester-army-ci creates and destroys its own
# native loopback stack and runs the phase journeys only after migrations,
# pgTAP and RLS pass.
#
# Nightly: every phase the owned production build serves, one runner
# invocation (`--phase`) and one owned stack per phase, each phase in its own
# parallel job (docs/testing/tester-army-ci.md, "Jobs parallèles"); a red
# phase never stops the others. The army-calc-v3 job is the check: it fails
# unless every planned phase passed with verified evidence, then retains it
# all as army-calc-v3-evidence. Since sub-lot 2.7 that is every phase: the
# emission phases (contract 1 "emission", engine-3 "emission-v3") run from the
# owned production build with the sandbox terms of its calc-v3 profile, so the
# guardrail (src/test/ci-guardrails.test.ts) requires both in
# CALC_V3_NIGHTLY_PHASES below. A dispatch runs the nightly selection, the
# whole campaign ("all", exactly npm run e2e:army:calc-v3, one job) or one
# phase.
#
# GitHub schedules and dispatches only a workflow already on the default
# branch: a pull request that edits this file runs the nightly selection, so
# the workflow change itself is proven before it merges (sub-lot 2.7 included).
# No other pull request runs it.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "nightly : phases servies par le build de production ; all : campagne complète, émission comprise ; sinon une seule phase."
        required: false
        default: nightly
        type: choice
        options:
          - nightly
          - all
          - journeys
          - components
          - numeric
          - resume
          - access
          - offers
          - emission
          - emission-v3
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/e2e-army-calc-v3.yml
  schedule:
    # After the nightly full suite (03:15 UTC), on its own runner.
    - cron: '45 4 * * *'

permissions:
  contents: read

concurrency:
  group: army-calc-v3-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  army-calc-v3-plan:
    name: army-calc-v3 plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      phases: ${{ steps.plan.outputs.phases }}
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Plan the calc-v3 phases
        id: plan
        # Phase names come from env, quoted; only names a JSON list can carry
        # verbatim pass, and the runner still refuses any that is not a phase.
        env:
          # The production-served phases (scripts/tester-army/calc-v3-phases.ts).
          CALC_V3_NIGHTLY_PHASES: "journeys components numeric resume access offers emission emission-v3"
          CALC_V3_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'nightly' }}
        run: |
          set -euo pipefail
          case "$CALC_V3_SELECTION" in
            nightly) read -r -a phases <<< "$CALC_V3_NIGHTLY_PHASES" ;;
            *) phases=("$CALC_V3_SELECTION") ;;
          esac
          for phase in "${phases[@]}"; do
            [[ "$phase" =~ ^[a-z0-9-]+$ ]] || { echo "::error title=TesterArmy calc-v3::Nom de phase invalide (attendu : [a-z0-9-]+)."; exit 1; }
          done
          list="$(printf '"%s",' "${phases[@]}")"
          echo "phases=[${list%,}]" >> "$GITHUB_OUTPUT"
          echo "TesterArmy calc-v3 : ${#phases[@]} job(s) : ${phases[*]}."

  # One owned stack per phase; a red phase never cancels the others.
  army-calc-v3-phase:
    name: army-calc-v3 ${{ matrix.phase }}
    needs: army-calc-v3-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.army-calc-v3-plan.outputs.phases) }}
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install TesterArmy Chromium
        run: npx @e2e-dev/web install chromium --with-deps
      # Restore only: e2e-army-critical.yml saves this cache on a push to main.
      - name: Restore the Army Next build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e/army/next/cache
          key: army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            army-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      # The runner reports its evidence directory only after the privacy check
      # passed (GITHUB_OUTPUT evidence=...), so a phase whose evidence failed
      # that check is never uploaded.
      - name: Run native database and TesterArmy calc-v3 phases
        id: journeys
        env:
          CALC_V3_PHASE: ${{ matrix.phase }}
        run: |
          set -uo pipefail
          if [[ "$CALC_V3_PHASE" == "all" ]]; then
            node --import tsx scripts/run-tester-army-ci.ts calc-v3
          else
            node --import tsx scripts/run-tester-army-ci.ts calc-v3 --phase "$CALC_V3_PHASE"
          fi
      - name: Retain sanitized business evidence
        if: always() && steps.journeys.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: army-calc-v3-${{ matrix.phase }}-evidence
          include-hidden-files: true
          path: ${{ steps.journeys.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7

  # The check of the campaign: green only when every planned phase passed on
  # its own stack with verified evidence (scripts/tester-army/aggregate-shards.ts),
  # naming the phases without proof otherwise.
  army-calc-v3:
    name: army-calc-v3
    needs: [army-calc-v3-plan, army-calc-v3-phase]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse any Supabase target other than loopback or the distinct staging host
        id: target_guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          normalize() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value,,}"
          }
          refuse() {
            echo "::error::$1"
            exit 1
          }

          url="$(normalize "${NEXT_PUBLIC_SUPABASE_URL:-}")"
          url="${url%/}"
          staging="$(normalize "${E2E_STAGING_SUPABASE_HOST:-}")"
          production="$(normalize "${PRODUCTION_SUPABASE_HOST:-}")"

          loopback_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$'
          if [[ "$url" =~ $loopback_pattern ]]; then
            echo "Cible Supabase : boucle locale du runner."
            exit 0
          fi

          label='[a-z0-9]([a-z0-9-]*[a-z0-9])?'
          host_pattern="^${label}(\.${label})+$"
          remote_pattern="^https://(${label}(\.${label})+)$"
          [[ "$url" =~ $remote_pattern ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL doit être une origine https nue (sans identifiants, port, chemin ni paramètre) ou une adresse de boucle locale."
          host="${BASH_REMATCH[1]}"

          [[ -n "$staging" ]] \
            || refuse "Variable E2E_STAGING_SUPABASE_HOST absente : aucun projet de recette distinct de la production n'est déclaré."
          [[ -n "$production" ]] \
            || refuse "Variable PRODUCTION_SUPABASE_HOST absente : impossible de prouver que la cible n'est pas la production."
          # Hotes nus seulement : sous forme d'URL, avec port, point final ou
          # joker, la comparaison avec la production serait toujours vraie et
          # la garde laisserait passer la production.
          [[ "$staging" =~ $host_pattern ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$production" =~ $host_pattern ]] \
            || refuse "PRODUCTION_SUPABASE_HOST doit être un nom d'hôte nu (sans schéma, port, chemin ni point final), par exemple <ref>.supabase.co."
          [[ "$staging" != "$production" ]] \
            || refuse "E2E_STAGING_SUPABASE_HOST désigne le projet de production."
          [[ "$host" != "$production" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL désigne le projet de production."
          [[ "$host" == "$staging" ]] \
            || refuse "NEXT_PUBLIC_SUPABASE_URL ne désigne pas l'hôte de recette E2E_STAGING_SUPABASE_HOST."
          echo "Cible Supabase : hôte de recette distinct de la production."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Download the phase evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: army-calc-v3-*-evidence
          path: .e2e/army/ci/aggregate-input/phases
      - name: Aggregate the calc-v3 phases
        id: aggregate
        env:
          PLAN_RESULT: ${{ needs.army-calc-v3-plan.result }}
          PHASES_RESULT: ${{ needs.army-calc-v3-phase.result }}
          PHASES_JSON: ${{ needs.army-calc-v3-plan.outputs.phases }}
        run: |
          set -euo pipefail
          phases="$(node -e 'process.stdout.write(JSON.parse(process.env.PHASES_JSON || "[]").join(","))')"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tester-army/aggregate-shards.ts calc-v3 \
            --phases "${phases:-none}" --evidence .e2e/army/ci/aggregate-input/phases --out .e2e/army/ci/aggregate \
            --results "army-calc-v3-plan=$PLAN_RESULT,army-calc-v3-phase=$PHASES_RESULT" --revision "$GITHUB_SHA"
      - name: Retain sanitized business evidence
        if: always() && steps.aggregate.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: army-calc-v3-evidence
          include-hidden-files: true
          path: ${{ steps.aggregate.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
