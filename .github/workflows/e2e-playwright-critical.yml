name: E2E Playwright Critical

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  e2e-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
      E2E_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing secret: NEXT_PUBLIC_SUPABASE_URL"
            missing=1
          fi

          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Missing secret: NEXT_PUBLIC_SUPABASE_ANON_KEY"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ -z "$E2E_LOGIN_EMAIL" ] || [ -z "$E2E_LOGIN_PASSWORD" ]; then
            echo "E2E login secrets not set: fallback defaults from README will be used."
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run critical Playwright suite
        run: npm run e2e:pw:critical

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
