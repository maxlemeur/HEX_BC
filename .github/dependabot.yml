version: 2

# Each Dependabot pull request starts the same checks as any other one (about
# 27 jobs), and merging one makes Dependabot rebase the others, which starts
# them again. Minor and patch updates therefore arrive as one pull request per
# ecosystem. A major update keeps its own pull request: it is the one likely to
# break (Supabase CLI 3 on 09/11/2026) and has to be read on its own.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # A dependency joins the first group whose patterns match it.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        # The Supabase CLI is pinned twice: in package.json and, with its
        # PostgreSQL bundle, in src/test/supabase-cli.ts, and the generated
        # database types record its version. A bump Dependabot writes changes
        # only package.json, so every database and Army job refuses it
        # (« Supabase CLI must be exactly … »). Inside the group it turned the
        # whole weekly pull request red (3.1.0 on 16/11/2026). It keeps its
        # own pull request, completed by hand like the one for 3.0.0.
        exclude-patterns:
          - "supabase"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
