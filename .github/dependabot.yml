version: 2

# Each Dependabot pull request starts the same checks as any other one (about
# 27 jobs), and merging one makes Dependabot rebase the others, which starts
# them again. Minor and patch updates therefore arrive as one pull request per
# ecosystem. A major update keeps its own pull request: it is the one likely to
# break and has to be read on its own.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # The Supabase CLI is upgraded by hand, as 3.0.0 was: package.json, the
    # CLI and PostgreSQL bundle pinned in src/test/supabase-cli.ts, and the
    # generated types (npm run supabase:types), which record the CLI version,
    # change together (docs/testing/tester-army-ci.md, "Mise à jour du CLI
    # Supabase"). A pull request Dependabot opens changes only package.json, so
    # every database and Army job refuses it (« Supabase CLI must be exactly
    # … »): 3.1.0 and 3.2.0 cost 4 red runs from 16 to 23/11/2026.
    ignore:
      - dependency-name: "supabase"
    # A dependency joins the first group whose patterns match it.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
